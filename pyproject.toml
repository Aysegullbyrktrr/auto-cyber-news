[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-cyber-news"
version = "0.1.0"
description = "Automated cybersecurity news aggregation and alerting platform."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "auto-cyber-news maintainers" }
]
dependencies = [
  "aiohttp>=3.9,<4.0",
  "anthropic>=0.40,<1.0",
  "beautifulsoup4>=4.12,<5.0",
  "feedparser>=6.0,<7.0",
  "Jinja2>=3.1,<4.0",
  "python-dotenv>=1.0,<2.0",
  "python-telegram-bot>=21.0,<22.0",
  "PyYAML>=6.0,<7.0",
]

[project.scripts]
auto-cyber-news = "auto_cyber_news.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auto_cyber_news = ["db/migrations/*.sql", "templates/*.j2"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
